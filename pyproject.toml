[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-competition-kit"
version = "0.1.0"
description = "Competition ML pipelines for tabular, time-series and image tasks, driven by a single config file."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "lightgbm>=4.0,<5",
    "xgboost>=2.0,<4",
    "catboost>=1.2,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
image = [
    "torch>=2.0,<3",
    "timm>=0.9,<2",
    "albumentations>=1.3,<3",
    "opencv-python-headless>=4.7,<5",
    "pillow>=9.0,<13",
]

[project.scripts]
automl = "automl.cli:main"

[tool.setuptools.packages.find]
include = ["automl*"]
